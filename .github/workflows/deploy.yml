name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  get-playwright-version:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get Playwright version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').devDependencies['@playwright/test'].replace(/[\^~]/g, '')")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  test-and-prepare:
    needs: get-playwright-version
    runs-on: ubuntu-26.04
    container: mcr.microsoft.com/playwright:v${{ needs.get-playwright-version.outputs.version }}-noble
    env:
      # Firefox will not start unless $HOME belongs to the user running it.
      HOME: /root
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Run E2E tests
        run: npx playwright test

      # The site is the app template plus the pages in site/overlay.
      # Assembling it here also records this commit and run for the home page.
      - name: Assemble and test the site
        run: npm run site:check

      # GitHub Pages serves this site from /<repository>/.
      - name: Build
        run: npm --prefix .site run build -- --base "/${{ github.event.repository.name }}/"

      # GitHub Pages serves 404.html for unknown paths, which lets the router
      # handle deep links such as /boba/docs.
      - name: Prepare 404 page for SPA
        run: cp .site/dist/index.html .site/dist/404.html

      - name: Upload built site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: .site/dist
          retention-days: 1

  merge-pages:
    needs: test-and-prepare
    runs-on: ubuntu-26.04
    concurrency:
      group: 'pages-branch'
      cancel-in-progress: false
    permissions:
      contents: write # update gh-pages while preserving /dashboard
    steps:
      - name: Download built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: ${{ runner.temp }}/site-dist

      - name: Merge site into gh-pages (preserving /dashboard)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="${{ runner.temp }}/pages-site"
          dist="${{ runner.temp }}/site-dist"
          remote="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"

          rm -rf "$dir"
          git init --quiet "$dir"
          cd "$dir"
          git config http."${GITHUB_SERVER_URL}/".extraheader "$auth"
          git remote add origin "$remote"
          if git fetch --quiet --depth 1 origin gh-pages 2>/dev/null; then
            git checkout --quiet -b gh-pages FETCH_HEAD
          else
            git checkout --quiet --orphan gh-pages
          fi

          # Replace everything at the root except .git, /dashboard and root llms.txt.
          find "$dir" -mindepth 1 -maxdepth 1 ! -name .git ! -name dashboard ! -name llms.txt -exec rm -rf {} +
          cp -R "$dist/." "$dir/"
          touch "$dir/.nojekyll"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit --quiet -m "Deploy Boba site (${GITHUB_SHA:0:7})"
            git push --quiet origin HEAD:gh-pages
          fi

          # Strip .git (which holds the temporary auth header) before packaging for Pages.
          rm -rf "$dir/.git"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: merge-pages
    runs-on: ubuntu-26.04
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
