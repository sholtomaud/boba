name: Scheduled Patching & Testing

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at midnight UTC
  workflow_dispatch: # Allow manual triggering

jobs:
  get-playwright-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Playwright version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').devDependencies['@playwright/test'].replace(/[\^~]/g, '')")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  patch-and-test:
    name: Patch & Test Dependencies
    needs: get-playwright-version
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v${{ needs.get-playwright-version.outputs.version }}-noble

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js v25
        uses: actions/setup-node@v4
        with:
          node-version: 25.x
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Update root dependencies to latest patches
        run: npm update

      - name: Ensure Playwright browser binaries are installed
        run: npx playwright install

      - name: Build root app
        run: npm run build

      - name: Run root unit & integration tests
        run: npm test

      - name: Run root E2E tests
        run: npm run e2e

      - name: Install and update template dependencies
        run: |
          cd template
          npm install
          npm update

      - name: Build template app
        run: |
          cd template
          npm run build

      - name: Run template unit tests
        run: |
          cd template
          npm test

      # --- AUTO-INCREMENT, INDEX UPDATE & COMMIT STEPS ---

      - name: Increment package patch version
        id: bump_version
        run: |
          # Increment patch version in package.json without tagging
          # 'npm version patch' automatically strips any 'v' prefix for package.json
          NEW_VERSION_RAW=$(npm version patch --no-git-tag-version)
          # NEW_VERSION_RAW output looks like "v1.0.1", strip leading 'v' if present for clean string parsing
          NEW_VERSION=${NEW_VERSION_RAW#v}
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Update version string in index.html
        run: |
          # Replace pattern matching semver (e.g. v1.0.0) with new version string (e.g. v1.0.1)
          sed -i -E "s/v[0-9]+\.[0-9]+\.[0-9]+/v${{ env.NEW_VERSION }}/g" index.html

      - name: Commit and push patched dependencies and version bump
        run: |
          # Fix git workspace permissions inside Docker container
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Stage package locks, package manifests, and updated index.html
          git add package.json package-lock.json index.html template/package.json template/package-lock.json
          
          # Only commit and push if dependencies or files actually changed
          if ! git diff --cached --quiet; then
            git commit -m "chore(patch): automated dependency patching and bump to v${{ env.NEW_VERSION }} [skip ci]"
            git tag "v${{ env.NEW_VERSION }}"
            git push origin HEAD:${{ github.ref_name }} --tags
          else
            echo "No dependency updates or changes found. Skipping commit."
          fi
