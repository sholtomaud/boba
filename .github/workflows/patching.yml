name: Scheduled Patching & Testing

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at midnight UTC
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  get-playwright-version:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get Playwright version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').devDependencies['@playwright/test'].replace(/[\^~]/g, '')")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  patch-and-test:
    name: Patch & Test Dependencies
    needs: get-playwright-version
    runs-on: ubuntu-26.04
    container: mcr.microsoft.com/playwright:v${{ needs.get-playwright-version.outputs.version }}-noble

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js v25
        uses: actions/setup-node@v7
        with:
          node-version: 25.x
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Update root dependencies to latest patches
        run: |
          npm update
          npm audit fix || true

      - name: Verify no high severity vulnerabilities in root
        run: npm audit --audit-level=high

      - name: Type-check and lint
        run: |
          npm run typecheck
          npm run lint

      - name: Run unit tests (CLI and template)
        run: npm test

      - name: Run E2E tests (builds the template app)
        run: npm run e2e

      # The template ships its own lockfile so scaffolded apps install the
      # same audited versions.
      - name: Update template dependencies
        run: |
          cd template
          npm install --package-lock-only
          npm update --package-lock-only
          npm audit fix --package-lock-only || true

      - name: Verify no high severity vulnerabilities in template
        run: |
          cd template
          npm audit --audit-level=high

      # --- AUTO-INCREMENT & COMMIT STEPS ---

      - name: Increment package patch version
        id: bump_version
        run: |
          # Increment patch version in package.json without tagging
          # 'npm version patch' automatically strips any 'v' prefix for package.json
          NEW_VERSION_RAW=$(npm version patch --no-git-tag-version)
          # NEW_VERSION_RAW output looks like "v1.0.1", strip leading 'v' if present for clean string parsing
          NEW_VERSION=${NEW_VERSION_RAW#v}
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Install GitHub CLI
        run: |
          apt-get update && apt-get install -y gh

      - name: Commit and create PR for patched dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fix git workspace permissions inside Docker container
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Stage package locks and package manifests
          git add package.json package-lock.json template/package.json template/package-lock.json
          
          # Only commit and create PR if dependencies or files actually changed
          if ! git diff --cached --quiet; then
            BRANCH_NAME="patch/deps-v${{ env.NEW_VERSION }}"
            git checkout -b "$BRANCH_NAME"
            git commit -m "chore(patch): automated dependency patching and bump to v${{ env.NEW_VERSION }} [skip ci]"
            git push --force origin "$BRANCH_NAME"
            gh pr create \
              --title "chore(patch): automated dependency patching and bump to v${{ env.NEW_VERSION }}" \
              --body "Automated dependency update and version bump to v${{ env.NEW_VERSION }}." \
              --head "$BRANCH_NAME" \
              --base "${{ github.ref_name }}" || true
          else
            echo "No dependency updates or changes found. Skipping commit."
          fi
