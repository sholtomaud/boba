# Keeps a release pull request open from Conventional Commit titles on main.
# Merging it updates CHANGELOG.md and package.json, tags the release, and
# publishes a GitHub Release so delivery metrics track real releases.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: node
