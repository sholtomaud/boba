name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  get-playwright-version:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get Playwright version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').devDependencies['@playwright/test'].replace(/[\^~]/g, '')")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-and-release:
    needs: get-playwright-version
    permissions:
      contents: write # create the release
    runs-on: ubuntu-26.04
    container: mcr.microsoft.com/playwright:v${{ needs.get-playwright-version.outputs.version }}-noble
    env:
      # Firefox will not start unless $HOME belongs to the user running it.
      HOME: /root
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run E2E tests
        run: npx playwright test

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
